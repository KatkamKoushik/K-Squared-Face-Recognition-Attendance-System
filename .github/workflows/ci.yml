name: K² FRS CI Pipeline

on:
  push:
    branches: [main, master, develop, "feat/**", "fix/**", "kaggle", "kaggle/**"]
  pull_request:
    branches: [main, master]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ============================================================================
  # 1. Teacher Mobile App (Flutter 3.27 / Dart 3.6+)
  # ============================================================================
  mobile-test:
    name: Flutter Mobile CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/teacher_mobile

    steps:
      - name: Checkout Source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.x"
          channel: "stable"
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Static Analysis
        run: flutter analyze

      - name: Run Widget & Unit Tests
        run: flutter test

  # ============================================================================
  # 2. Admin Web Console (Next.js 15 / Node.js 22)
  # ============================================================================
  admin-test:
    name: Next.js Admin Console CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/admin_console

    steps:
      - name: Checkout Source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/admin_console/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Typecheck
        run: npm run typecheck

      - name: Run Unit Tests
        run: npm test

      - name: Run Production Build
        run: npm run build

  # ============================================================================
  # 3. Control Plane & Vision Worker (FastAPI / Python 3.12)
  # ============================================================================
  backend-test:
    name: Backend Control Plane CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Download Approved Vision Models
        run: python ../scripts/download_vision_models.py

      - name: Run Pytest Suite
        run: python -m pytest tests/ -v -m "not playwright"

      - name: Run Acceptance & Invariant Verification Suite
        run: python verify_backend.py

  # ============================================================================
  # 4. Shared Contracts & Repository Hygiene
  # ============================================================================
  contracts-and-hygiene:
    name: Shared Contracts & Repository Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/admin_console/package-lock.json

      - name: Install Monorepo Tooling
        run: npm --prefix apps/admin_console ci

      - name: Verify TypeScript OpenAPI Contracts
        run: node apps/admin_console/node_modules/typescript/bin/tsc --noEmit packages/contracts/src/index.ts

      - name: Validate OpenAPI JSON Schema Syntax
        run: node -e "JSON.parse(require('fs').readFileSync('packages/contracts/openapi.json', 'utf8')); console.log('✓ OpenAPI spec valid JSON');"

      - name: Check for Unresolved Merge Conflict Markers
        run: |
          if git grep -I "^<<<<<<< "; then
            echo "::error::Unresolved merge conflict markers detected in repository!"
            exit 1
          fi
          echo "✓ Zero merge conflict markers found."

      - name: Verify Secret Leaks & Prohibited Private Files (Checklist 08-B001 & 65-B001)
        run: |
          if git ls-files | grep -E "(\.env|\.key|\.pem|id_rsa|\.p12)$"; then
            echo "::error::Prohibited sensitive credentials file detected in repository!"
            exit 1
          fi
          echo "✓ Zero sensitive credential files found."

      - name: Verify Robots Exclusion & Crawl Policy (Checklist 14-B017)
        run: |
          if ! grep -q "Disallow: /" apps/admin_console/public/robots.txt; then
            echo "::error::Admin console robots.txt must disallow crawler indexing!"
            exit 1
          fi
          echo "✓ Admin console robots.txt exclusion verified."

  # ============================================================================
  # 5. Playwright Browser E2E UI Automation (Chromium)
  # ============================================================================
  playwright-e2e:
    name: Playwright E2E UI Automation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [admin-test, backend-test]

    steps:
      - name: Checkout Source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/admin_console/package-lock.json

      - name: Install Admin Console Dependencies & Build
        run: |
          cd apps/admin_console
          npm ci
          npm run build

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend & Playwright Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m playwright install --with-deps chromium

      - name: Run Playwright E2E Test Suite
        run: |
          cd backend
          python -m pytest tests/test_playwright_admin_console.py -v
